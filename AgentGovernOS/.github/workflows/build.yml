name: build-images

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build governance-api image
        run: docker build -t agentgovern-api:ci services/governance-api
      - name: Build crewai-engine image
        run: docker build -t agentgovern-crewai:ci services/crewai-engine
      - name: Validate compose file
        run: docker compose config
