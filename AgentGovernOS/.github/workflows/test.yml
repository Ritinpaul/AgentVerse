name: test

on:
  pull_request:
  push:
    branches: [ main, master ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/governance-api/requirements.txt
          pip install pytest pytest-asyncio pytest-cov aiosqlite fakeredis
      - name: Run critical tests
        run: |
          pytest tests/test_endpoints.py tests/test_sap_btp_adapter.py -q --continue-on-collection-errors

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci --legacy-peer-deps
      - name: Build
        run: npm run build
