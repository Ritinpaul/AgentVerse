name: Performance Benchmarks

on:
  push:
    branches: [main, develop]
    paths:
      - 'services/governance-api/**'
      - 'benchmarks/**'
  pull_request:
    branches: [main]
    paths:
      - 'services/governance-api/**'
      - 'benchmarks/**'
  # Allow manual trigger for on-demand baseline measurement
  workflow_dispatch:

jobs:
  benchmark:
    name: Run Latency Benchmarks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agentgovern
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: agentgovern_bench
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgresql+asyncpg://agentgovern:secret@localhost:5432/agentgovern_bench
      REDIS_URL: redis://localhost:6379/0
      APP_ENV: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          pip install aiosqlite pytest-benchmark  # For SQLite fallback and benchmarking

      - name: Run policy engine micro-benchmarks (pure Python, no I/O)
        run: |
          pytest benchmarks/test_policy_engine.py \
            --benchmark-only \
            --benchmark-json=benchmarks/results/policy_engine.json \
            --benchmark-min-rounds=50 \
            -v
        continue-on-error: false

      - name: Run governance evaluate HTTP benchmarks
        run: |
          pytest benchmarks/test_governance_evaluate.py \
            --benchmark-only \
            --benchmark-json=benchmarks/results/governance_evaluate.json \
            --benchmark-min-rounds=10 \
            -v
        env:
          # Use SQLite for CI benchmark — avoids PostgreSQL cold start affecting latency
          DATABASE_URL: sqlite+aiosqlite:///./benchmark_test.db
        continue-on-error: true  # Don't fail CI if HTTP bench times out

      - name: Print benchmark summary
        run: |
          echo "## Benchmark Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f benchmarks/results/policy_engine.json ]; then
            echo "### Policy Engine (pure Python, no I/O)" >> $GITHUB_STEP_SUMMARY
            python -c "
          import json, sys
          with open('benchmarks/results/policy_engine.json') as f:
              data = json.load(f)
          print('| Test | Mean (μs) | p95 (μs) | p99 (μs) |')
          print('|------|-----------|----------|----------|')
          for bench in data.get('benchmarks', []):
              name = bench['name'].replace('test_bench_', '')
              mean = bench['stats']['mean'] * 1_000_000
              p95  = bench['stats'].get('percentile_95', bench['stats']['mean']) * 1_000_000
              p99  = bench['stats'].get('percentile_99', bench['stats']['mean']) * 1_000_000
              print(f'| {name} | {mean:.1f} | {p95:.1f} | {p99:.1f} |')
            " >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**SLO Target:** p99 < 50ms for /governance/evaluate" >> $GITHUB_STEP_SUMMARY

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results-${{ github.sha }}
          path: benchmarks/results/
          retention-days: 30

      - name: Check SLO regression (policy engine)
        run: |
          python -c "
          import json, sys
          try:
              with open('benchmarks/results/policy_engine.json') as f:
                  data = json.load(f)
          except FileNotFoundError:
              print('No benchmark results found — skipping SLO check')
              sys.exit(0)

          POLICY_ENGINE_P99_LIMIT_US = 5_000  # 5ms — pure Python should be < 1ms
          failed = []
          for bench in data.get('benchmarks', []):
              # pytest-benchmark uses 'mean' in seconds; compute rough p99 from stddev
              mean_us = bench['stats']['mean'] * 1_000_000
              if mean_us > POLICY_ENGINE_P99_LIMIT_US:
                  failed.append(f'{bench[\"name\"]}: mean {mean_us:.1f}μs > {POLICY_ENGINE_P99_LIMIT_US}μs SLO')

          if failed:
              print('SLO REGRESSION DETECTED:')
              for f in failed:
                  print(f'  - {f}')
              sys.exit(1)
          else:
              print('All SLOs met ✓')
          "
