[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "state-plane"
version = "0.1.0"
description = "AgentOS State Plane Service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.1",
    "redis>=5.0.7",
    "pydantic>=2.7.4",
    "websockets>=13.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100
