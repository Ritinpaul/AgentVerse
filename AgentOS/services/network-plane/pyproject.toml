[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "network-plane"
version = "0.1.0"
description = "AgentOS Network Plane"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.1",
    "httpx>=0.27.0",
    "pydantic>=2.7.4"
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
