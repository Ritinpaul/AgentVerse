[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentos-cli"
version = "0.1.0"
description = "AgentOS CLI tool for developers"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.3",
    "httpx>=0.27.0",
    "pyyaml>=6.0.1",
    "rich>=13.7.1",
]

[project.scripts]
agentos = "main:app"
