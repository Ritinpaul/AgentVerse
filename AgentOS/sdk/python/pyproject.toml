[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentos-sdk"
version = "0.1.0"
description = "AgentOS Python SDK for building autonomous agents."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.4",
    "websockets>=13.0",
    "click>=8.1.7",
    "pyyaml>=6.0.1",
]

[project.scripts]
nuuvixx = "nuuvixx.cli:cli"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100
