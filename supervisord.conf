[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:agentstore-backend]
command=python -m uvicorn app.main:app --host 0.0.0.0 --port 8005
directory=/workspace/AgentStore/backend
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/agentstore-backend.log
stderr_logfile=/var/log/supervisor/agentstore-backend-error.log

[program:agentos-control-plane]
command=python -m uvicorn app.main:app --host 0.0.0.0 --port 8010
directory=/workspace/AgentOS/services/control-plane
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/agentos-control-plane.log
stderr_logfile=/var/log/supervisor/agentos-control-plane-error.log

[program:agentos-execution-plane]
command=python -m uvicorn app.main:app --host 0.0.0.0 --port 8012
directory=/workspace/AgentOS/services/execution-plane
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/agentos-execution-plane.log
stderr_logfile=/var/log/supervisor/agentos-execution-plane-error.log

[program:agentos-state-plane]
command=python -m uvicorn app.main:app --host 0.0.0.0 --port 8014
directory=/workspace/AgentOS/services/state-plane
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/agentos-state-plane.log
stderr_logfile=/var/log/supervisor/agentos-state-plane-error.log

[program:agentgovernos-api]
command=python -m uvicorn main:app --host 0.0.0.0 --port 8025
directory=/workspace/AgentGovernOS/services/governance-api
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/agentgovernos-api.log
stderr_logfile=/var/log/supervisor/agentgovernos-api-error.log


[program:agentverse-console]
command=npm run dev
directory=/workspace/console
environment=PORT="3000"
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/agentverse-console.log
stderr_logfile=/var/log/supervisor/agentverse-console-error.log
