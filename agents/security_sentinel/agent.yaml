name: security-sentinel
slug: nuuvixx/security-sentinel
version: 1.0.0
description: Autonomous DevSecOps agent that performs static vulnerability auditing, identity key scanning, dependency CVE analysis, and automated PII redaction on codebases.
author: Nuuvixx Security Labs
category: Security & DevSecOps
tags:
  - security
  - devsecops
  - identity-audit
  - static-analysis
  - pii-redaction

model:
  name: gpt-4o-2024-08-06
  temperature: 0.1
  max_tokens: 8192
  fallback_model: groq/llama-3.1-70b

tools:
  - name: static_vulnerability_scanner
    type: mcp
    server: filesystem
    description: Scans source files for OWASP Top 10 vulnerabilities, insecure patterns, and unhandled exceptions.
  - name: identity_inspector
    type: mcp
    server: memory
    description: Detects exposed API keys, private RSA keys, database credentials, and OAuth tokens.
  - name: pii_redactor
    type: mcp
    server: sequential-thinking
    description: Mask SSNs, credit card numbers, email addresses, and bearer tokens in logs and reports.

policies:
  sandbox:
    profile: strict
    network_mode: egress_filtered
    max_memory_mb: 512
  pii:
    redact_emails: true
    redact_ssn: true
  cost:
    max_cost_per_run_usd: 0.50

capabilities:
  - code:audit
  - identity:scan
  - cve:check
  - pii:redact


